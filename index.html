<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gobbler Gauntlet</title>
  <link rel="icon" href="assets/icon.jpg" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #140e0a;
      color: #f6e7c8;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #1a120c;
      box-shadow: 0 0 0 4px #3a2416;
      touch-action: none;
    }
    h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
  </style>
</head>
<body>
  <h1>Gobbler Gauntlet</h1>
  <canvas id="game" width="1280" height="720">A canvas-capable browser is required.</canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
